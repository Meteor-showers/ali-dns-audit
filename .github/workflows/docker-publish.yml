name: 发布镜像

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]*"
      - "!v*alpha*"
      - "!v*beta*"
      - "!v*preview*"
      - "!v*rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定版本，例如 v1.2.0。留空则自动递增修订号"
        required: false
        default: ""

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment: DOCKERHUB
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          git fetch --tags --force
          is_semver() {
            echo "$1" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          }
          highest() {
            git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true
          }
          bump() {
            local latest="$1"
            if [ -z "$latest" ]; then
              echo v1.0.0
              return
            fi
            local ver="${latest#v}"
            local major="${ver%%.*}"
            local rest="${ver#*.}"
            local minor="${rest%%.*}"
            local patch="${rest#*.}"
            echo "v${major}.${minor}.$((patch + 1))"
          }
          version=""
          create=0
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            version="$INPUT_TAG"
            create=1
          else
            pointed="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -n "$pointed" ]; then
              version="$pointed"
            else
              version="$(bump "$(highest)")"
              create=1
            fi
          fi
          if ! is_semver "$version"; then
            echo "版本号必须是 v1.2.3 这种格式" >&2
            exit 1
          fi
          if [ "$create" = "1" ]; then
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "版本 $version 已存在" >&2
              exit 1
            fi
            git tag "$version"
            git push origin "refs/tags/$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: 检查 Docker Hub 密钥
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "请在仓库 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN"
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            plutosdocker/ali-dns-audit
            ghcr.io/meteor-showers/ali-dns-audit
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern=v{{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.version.outputs.version }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            USE_CN_MIRROR=0
            PIP_INDEX=https://pypi.org/simple
          labels: |
            org.opencontainers.image.source=https://github.com/Meteor-showers/ali-dns-audit
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
