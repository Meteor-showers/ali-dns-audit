{% extends "base.html" %}
{% block title %}{% if site and site.id %}编辑平台{% else %}添加平台{% endif %}{% endblock %}
{% block body %}
<header class="page-head">
  <div>
    <p class="crumb"><a href="/sites">平台</a><span>/</span>{% if site and site.id %}编辑{% else %}新建{% endif %}</p>
    <h1>{% if site and site.id %}编辑 {{ site.name }}{% else %}添加平台{% endif %}</h1>
  </div>
</header>
<section class="panel">
  <form method="post" action="{% if site and site.id %}/sites/{{ site.id }}{% else %}/sites{% endif %}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="grid">
      <label>
        <span>平台名称</span>
        <input type="text" name="name" required value="{{ site.name if site else '' }}">
      </label>
      <label>
        <span>服务商</span>
        <select name="provider" id="provider">
          {% for key, label in providers.items() %}
            <option value="{{ key }}" {% if site and site.provider == key %}selected{% elif not site and key == 'aliyun' %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span id="ak-label">AccessKey ID</span>
        <input type="text" name="access_key" required value="{{ site.access_key if site else '' }}" autocomplete="off">
      </label>
      <label>
        <span id="sk-label">AccessKey Secret</span>
        <input type="password" name="secret_key" value="" autocomplete="new-password" placeholder="{% if site and site.id %}留空则不修改{% else %}必填{% endif %}" {% if not site or not site.id %}required{% endif %}>
      </label>
      <label class="wide">
        <span>平台代理</span>
        <input type="text" name="proxy" value="{{ site.proxy if site else '' }}" placeholder="留空则使用全局代理，例如 socks5://127.0.0.1:1080">
      </label>
      <label class="wide">
        <span>备注</span>
        <input type="text" name="remark" value="{{ site.remark if site else '' }}">
      </label>
    </div>
    <p class="help" id="provider-help"></p>
    <div class="toolbar">
      <button class="btn btn-primary" type="submit">保存</button>
      <a class="btn" href="/sites">返回</a>
    </div>
  </form>
</section>
<script>
  const help = {
    aliyun: "阿里云 RAM 用户的 AccessKey，需要 AliyunDNSFullAccess 或同等权限。",
    tencent: "腾讯云 API 密钥 SecretId / SecretKey，需要 DNSPod 读写权限。",
    dnspod: "DNSPod 控制台的 Token，ID 和 Token 分开填写。",
    wix: "账号级 API Key。Account ID 填上面，Authorization 填 API Key。只能改 Wix 托管 DNS 的域名。"
  };
  const ak = { aliyun: "AccessKey ID", tencent: "SecretId", dnspod: "Token ID", wix: "Account ID" };
  const sk = { aliyun: "AccessKey Secret", tencent: "SecretKey", dnspod: "Token", wix: "Authorization" };
  const provider = document.getElementById("provider");
  function syncProvider() {
    const value = provider.value;
    document.getElementById("ak-label").textContent = ak[value] || "密钥 ID";
    document.getElementById("sk-label").textContent = sk[value] || "密钥";
    document.getElementById("provider-help").textContent = help[value] || "";
  }
  provider.addEventListener("change", syncProvider);
  syncProvider();
</script>
{% endblock %}
